<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon (rebuild Phase 4): Today's teal ring on the night page, from the design's
       tokens (docs/rebuild/design.md). The icons and splash screens are made from this file
       with the icons script of app/package.json. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="58%">
      <stop offset="0" stop-color="#52BFB0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EE3D6"/>
      <stop offset="1" stop-color="#52BFB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#07090E"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="30"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" stroke-dasharray="651 930" transform="rotate(-90 256 256)"/>
</svg>
