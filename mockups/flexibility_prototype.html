<title>Flexibility capture — prototype</title>

<style>
  :root {
    color-scheme: dark;
    --bg:#0B0F1A; --panel:#0E1018; --ink:#F4F6FB; --ink2:#9AA3B2; --ink3:#5A6377;
    --accent:#22C3E6; --good:#6BAF8B; --warn:#BFA06A; --bad:#C47878;
    --hair:rgba(255,255,255,0.07);
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 80px}
  .bar{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:14px;border-bottom:1px solid var(--hair);margin-bottom:20px}
  .bar b{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .bar .rs{font-size:11px;color:var(--ink3);cursor:pointer;border:1px solid var(--hair);
    padding:5px 11px;border-radius:8px;background:transparent;color:var(--ink3);
    font-family:inherit}
  .bar .rs:hover{color:var(--ink2);border-color:var(--ink3)}

  .card{background:var(--panel);border:1px solid var(--hair);border-radius:14px;
    padding:16px 18px;margin-bottom:10px}
  .card.hi{border-color:rgba(196,120,120,.45);background:rgba(196,120,120,.07)}
  .cap{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
    font-weight:700}
  .huge{font-size:38px;font-weight:800;line-height:1.08;margin-top:8px}
  .big{font-size:28px;font-weight:800;line-height:1.12;margin-top:6px}
  .sm{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.65}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .nm{font-size:15px;font-weight:650;color:var(--ink)}
  .val{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums}
  .val u{text-decoration:none;font-size:10px;color:var(--ink3);font-weight:500}
  .track{height:7px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:9px;
    position:relative;overflow:hidden}
  .track i{display:block;height:100%;border-radius:4px}
  .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--good)}
  .kv{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--ink3)}
  .kv b{color:var(--ink2);font-weight:650}

  .steps{display:flex;gap:3px;margin-bottom:14px}
  .steps i{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,.10)}
  .steps i.done{background:var(--good)} .steps i.now{background:var(--accent)}
  .steps i.skip{background:var(--ink3)} .steps i.void{background:var(--bad)}

  .lock{background:rgba(191,160,106,.11);border:1px solid rgba(191,160,106,.32);
    color:#E2CB9B;border-radius:10px;padding:11px 13px;font-size:11.5px;
    line-height:1.65;margin:12px 0}
  details{background:var(--panel);border:1px solid var(--hair);border-radius:11px;
    padding:10px 14px;margin-bottom:10px}
  details summary{cursor:pointer;font-size:12px;color:var(--ink2)}
  details .sm{margin-top:10px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .grid.one{grid-template-columns:1fr}
  .fld{background:rgba(255,255,255,.04);border:1px solid var(--hair);
    border-radius:9px;padding:8px 11px;margin-top:7px}
  .fld .l{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
    font-weight:650}
  .fld input{width:100%;background:transparent;border:0;color:var(--ink);
    font:650 17px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:4px;
    font-variant-numeric:tabular-nums;outline:none}
  .fld.blank input{color:var(--ink3)}

  .chk{display:flex;align-items:center;gap:9px;margin:14px 0 4px;font-size:12px;
    color:var(--ink2);cursor:pointer}
  .chk input{width:15px;height:15px;accent-color:var(--bad);cursor:pointer}

  .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button.b{flex:1;min-width:110px;padding:13px 14px;border-radius:11px;border:0;
    font:800 13.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;
    background:var(--accent);color:#04222B}
  button.b.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink2);
    font-weight:600}
  button.b:hover{filter:brightness(1.08)}
  .back{margin-top:12px;background:transparent;border:0;color:var(--ink3);
    font:12px ui-monospace,Menlo,monospace;cursor:pointer;padding:4px 0}
  .back:hover{color:var(--ink2)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9.5px;
    font-weight:700}
  .note{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.6}
  .banner{background:rgba(34,195,230,.09);border:1px solid rgba(34,195,230,.3);
    border-radius:10px;padding:11px 13px;font-size:11.5px;color:#A9E6F5;margin-bottom:12px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>

   "label": "Shoulder flexion",
   "ladder": [
    "shoulders_overhead",
    "lats",
    "chest_horizontal",
    "thoracic_rotation",
    "lumbar"
   ],
   "goal": 70.0,
   "gates": "Overhead work (currently prohibited), lat pulldown path",
   "excluded": ""
  },
  {
   "key": "active_pike",
   "label": "Active pike",
   "ladder": [
    "hamstrings",
    "lumbar"
   ],
   "goal": 70.0,
   "gates": "RDL, hinge pattern",
   "excluded": ""
  },
  {
   "key": "bridge",
   "label": "Bridge",
   "ladder": [
    "hip_flexors",
    "shoulders_overhead",
    "thoracic_rotation"
   ],
   "goal": 70.0,
   "gates": "\u2014",
   "excluded": "End-range lumbar extension against L5/S1 retrolisthesis and activated osteochondrosis; services.rules already contraindicates 'hyperextension' and 'back extension'. Its COMPONENTS are exactly what this athlete needs and remain rungs elsewhere \u2014 only the composite goal is refused."
  },
  {
   "key": "shoulder_extension",
   "label": "Shoulder extension",
   "ladder": [
    "chest_horizontal",
    "shoulders_overhead"
   ],
   "goal": 70.0,
   "gates": "\u2014",
   "excluded": "The apprehension direction for an anterior-instability shoulder post-Latarjet (finding #6). Tracked so regression is visible; never a target to maximise."
  }
 ],
 "measures": [
  "passive",
  "isometric",
  "active"
 ]
};
const M = DATA.measures;
let S = null;

function reset(){
  S = {screen:'intro', step:0, cold:true, readings:{}, status:{}};
  render();
}

function scoreOf(r, v){
  if(v===null||v===undefined||v==='') return null;
  const s = (v - r.v0) / (r.v100 - r.v0) * 100;
  return Math.max(0, Math.min(100, s));
}

// A rung scores from ACTIVE where it exists, else isometric, else passive —
// a passive ceiling you cannot enter under your own power does not limit a
// skill any less for being high.
function rungScore(key){
  const st = S.status[key];
  if(st === 'skip' || st === 'void') return null;
  const rd = S.readings[key];
  if(!rd) return null;
  const r = DATA.rungs.find(x=>x.key===key);
  let worst = null;
  for(const side in rd){
    const [p,i,a] = rd[side];
    const v = (a!==null&&a!==undefined&&a!=='') ? a
            : (i!==null&&i!==undefined&&i!=='') ? i : p;
    const s = scoreOf(r, v===''?null:v);
    if(s===null) continue;
    if(worst===null || s < worst) worst = s;   // the worse SIDE limits
  }
  return worst;
}

function gapOf(key){
  const rd = S.readings[key]; if(!rd) return null;
  const r = DATA.rungs.find(x=>x.key===key);
  let g = null;
  for(const side in rd){
    const [p,i,a] = rd[side];
    const ps = scoreOf(r, p===''?null:p), as = scoreOf(r, a===''?null:a);
    if(ps===null||as===null) continue;
    const d = ps - as;
    if(g===null || d > g) g = d;
  }
  return g;
}

function skillScore(sk){
  let best=null, lim=null, unmeasured=[];
  for(const k of sk.ladder){
    const s = rungScore(k);
    if(s===null){ unmeasured.push(k); continue; }
    if(best===null || s < best){ best=s; lim=k; }   // MIN, never a mean
  }
  return {score:best, limiter:lim, unmeasured};
}

function el(h){ document.getElementById('app').innerHTML = h; }
function lbl(k){ const r=DATA.rungs.find(x=>x.key===k); return r?r.label:k; }

function stepsBar(){
  return '<div class="steps">' + DATA.rungs.map((r,i)=>{
    const st = S.status[r.key];
    const c = i===S.step ? 'now' : st==='skip' ? 'skip' : st==='void' ? 'void'
            : S.readings[r.key] ? 'done' : '';
    return `<i class="${c}"></i>`;
  }).join('') + '</div>';
}

function render(){
  document.getElementById('foot').innerHTML =
    'Prototype only — readings are pre-filled and nothing is saved anywhere. '
    + 'Rung definitions, locks and scales are the real ones from '
    + 'flexibility_baselines.py.';

  if(S.screen==='intro') return renderIntro();
  if(S.screen==='cold')  return renderCold();
  if(S.screen==='step')  return renderStep();
  return renderDone();
}

function renderIntro(){
  el(`<div class="card">
      <div class="cap">Standing goal &middot; no deadline</div>
      <div class="huge" style="color:var(--accent)">Not measured</div>
      <div class="sm">${DATA.rungs.length} tests &middot; ~40 min &middot;
        measured <b style="color:var(--ink2)">cold</b>, no warm-up.<br>
        Every 6&ndash;12 weeks. Nothing else on this screen works until it runs once.</div>
    </div>
    <div class="btns"><button class="b" onclick="S.screen='cold';render()">Start assessment</button></div>
    <div class="card" style="margin-top:12px">
      <div class="nm" style="font-size:13px;color:var(--ink2)">Why there is nothing else here</div>
      <div class="sm">The 22 yoga depth-ratings are kept in full, and feed nothing. They answer
        &ldquo;how far did I get <i>and</i> how much did I feel&rdquo; &mdash; neither of the two
        things this model measures.</div>
    </div>`);
}

function renderCold(){
  el(`<div class="card">
      <div class="cap">Before you start</div>
      <div class="big" style="color:var(--accent)">Measure cold</div>
      <div class="sm">No warm-up, no session beforehand. A warm reading measures the
        viscoelastic effect, which is gone within hours &mdash; a cold one isolates the
        durable change. A warm session is still recorded, but it is labelled and never
        compared with a cold one.</div>
      <label class="chk"><input type="radio" name="c" checked
        onchange="S.cold=true"> Cold &mdash; no warm-up</label>
      <label class="chk"><input type="radio" name="c"
        onchange="S.cold=false"> Warm &mdash; I have trained today</label>
    </div>
    <div class="btns">
      <button class="b" onclick="S.screen='step';S.step=0;render()">Begin</button>
      <button class="b ghost" onclick="S.screen='intro';render()">Cancel</button>
    </div>`);
}

function renderStep(){
  const r = DATA.rungs[S.step];
  const sides = r.bilateral ? ['left','right'] : [''];
  const pre = S.readings[r.key];

  const fields = sides.map(side=>{
    const vals = pre ? pre[side] : (r.fake[side] || [null,null,null]);
    const inner = M.map((m,i)=>{
      const v = vals[i];
      const blank = (v===null||v===undefined||v==='') ? ' blank' : '';
      return `<div class="fld${blank}"><div class="l">${m} (${r.unit})</div>
        <input id="in_${side}_${i}" value="${v===null||v===undefined?'':v}"
          placeholder="—"></div>`;
    }).join('');
    return `<div>${side?`<div class="cap">${side}</div>`:''}${inner}</div>`;
  }).join('');

  const last = S.step === DATA.rungs.length - 1;
  el(`${stepsBar()}
    <div class="row"><span class="nm">${r.label}</span>
      <span class="cap">${S.step+1} of ${DATA.rungs.length}</span></div>
    <div class="sm" style="margin-top:2px">${r.test}</div>
    <div class="lock"><b>LOCK</b> &mdash; ${r.lock}</div>
    <div class="card"><div class="sm" style="color:var(--ink2)">${r.setup}</div></div>
    <details><summary>How to read it</summary>
      <div class="sm">${r.measurement}</div>
      <div class="sm">Scale: <b style="color:var(--ink2)">${r.v100}${r.unit} = 100</b>
        &middot; <b style="color:var(--ink2)">${r.v0}${r.unit} = 0</b></div>
      ${r.replaces?`<div class="sm">Replaces ${r.replaces}.</div>`:''}
      ${r.safety?`<div class="sm" style="color:#E2CB9B">${r.safety}</div>`:''}
    </details>
    <div class="grid${sides.length===1?' one':''}">${fields}</div>
    <label class="chk"><input type="checkbox" id="void"> The lock was lost &mdash; void this trial</label>
    <div class="btns">
      <button class="b" onclick="save()">${last?'Save &amp; finish':'Save &amp; next'}</button>
      <button class="b ghost" onclick="mark('skip')">Skip</button>
    </div>
    ${S.step>0?'<button class="back" onclick="S.step--;render()">&larr; Back</button>':''}`);
}

function save(){
  const r = DATA.rungs[S.step];
  const sides = r.bilateral ? ['left','right'] : [''];
  if(document.getElementById('void').checked) return mark('void');
  const out = {};
  let any = false;
  for(const side of sides){
    out[side] = M.map((m,i)=>{
      const raw = document.getElementById(`in_${side}_${i}`).value.trim();
      if(raw===''){ return null; }
      any = true; return parseFloat(raw);
    });
  }
  if(any){ S.readings[r.key] = out; delete S.status[r.key]; }
  advance();
}

function mark(kind){
  const r = DATA.rungs[S.step];
  S.status[r.key] = kind;
  delete S.readings[r.key];
  advance();
}

function advance(){
  if(S.step === DATA.rungs.length-1){ S.screen='done'; }
  else { S.step++; }
  render();
}

function renderDone(){
  const active = DATA.skills.filter(s=>!s.excluded);
  const scored = active.map(s=>({sk:s, ...skillScore(s)}));

  // "limits N of 4" is a COUNT of how many ladders this rung is lowest on —
  // not a new metric. lumbar sits on all four.
  const counts = {};
  scored.forEach(x=>{ if(x.limiter) counts[x.limiter]=(counts[x.limiter]||0)+1; });
  let lead=null, leadScore=null;
  for(const k in counts){
    const s = rungScore(k);
    if(s===null) continue;
    if(leadScore===null || s<leadScore){ leadScore=s; lead=k; }
  }

  const measured = DATA.rungs.filter(r=>rungScore(r.key)!==null).length;
  const gaps = DATA.rungs.filter(r=>gapOf(r.key)!==null).length;

  let h = `<div class="card"><div class="cap">Flexibility</div>
    <div class="sm">Assessed today &middot; ${S.cold?'cold':'<b style="color:var(--warn)">WARM — not comparable with a cold reading</b>'}
    &middot; ${measured} of ${DATA.rungs.length} rungs &middot; ${gaps} with a
    passive&minus;active gap</div></div>`;

  if(lead){
    const g = gapOf(lead);
    const pres = g===null ? 'gap not measured' : (g>=25 ? 'needs strength' : 'needs range');
    h += `<div class="card hi"><div class="cap" style="color:var(--bad)">Train this</div>
      <div class="big" style="color:var(--bad)">${lbl(lead)}</div>
      <div class="kv"><span><b>${leadScore.toFixed(0)}</b>/100</span>
      <span>limits <b>${counts[lead]} of ${active.length}</b> skills</span>
      <span>gap <b>${g===null?'—':(g>0?'+':'')+g.toFixed(0)}</b> &rarr; <b>${pres}</b></span></div></div>`;
  }

  h += `<div class="cap" style="margin:18px 0 8px">Skills</div>`;
  for(const x of scored){
    if(x.score===null){
      h += `<div class="card"><div class="row"><span class="nm">${x.sk.label}</span>
        <span class="val" style="color:var(--ink3);font-size:14px">not measured</span></div>
        <div class="sm">${x.unmeasured.length} rung(s) with no reading</div></div>`;
      continue;
    }
    const c = x.score>=x.sk.goal ? 'var(--good)' : x.score>=x.sk.goal*0.8 ? 'var(--warn)' : 'var(--bad)';
    h += `<div class="card"><div class="row"><span class="nm">${x.sk.label}</span>
      <span class="val" style="color:${c}">${x.score.toFixed(0)}<u>/100</u></span></div>
      <div class="track"><i style="width:${x.score}%;background:${c}"></i>
        <span class="goal" style="left:${x.sk.goal}%"></span></div>
      <div class="sm">limited by <b style="color:var(--ink2)">${lbl(x.limiter)}</b>
        &middot; gates ${x.sk.gates}</div>
      ${x.unmeasured.length?`<div class="sm" style="color:var(--warn)">&#9888; upper bound &mdash;
        ${x.unmeasured.length} rung(s) unmeasured, and an unmeasured rung could be lower
        than anything seen</div>`:''}</div>`;
  }

  h += `<details style="margin-top:12px"><summary>What could be limiting you &middot;
    ${DATA.rungs.length} tests</summary>
    <div class="sm">Diagnostics &mdash; only the <b>lowest</b> one limits a skill.
    Never averaged into anything.</div>`;
  for(const r of DATA.rungs){
    const s = rungScore(r.key), g = gapOf(r.key), st = S.status[r.key];
    if(s===null){
      h += `<div class="sm">${r.label} &mdash; <span style="color:var(--ink3)">${
        st==='skip'?'skipped':st==='void'?'voided (lock lost)':'not measured'}</span></div>`;
      continue;
    }
    const pres = g===null?'':(g>=25?' &rarr; needs strength':' &rarr; needs range');
    h += `<div class="sm"><b style="color:var(--ink2)">${r.label}</b> ${s.toFixed(0)}/100${
      g===null?'':` &middot; gap ${(g>0?'+':'')+g.toFixed(0)}${pres}`}</div>`;
  }
  h += `</details>
    <div class="btns"><button class="b ghost" onclick="reset()">Run it again</button></div>`;
  el(h);
}

reset();
</script>
